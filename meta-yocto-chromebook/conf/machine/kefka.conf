# Dell Chromebook 11 3180 / 3189 family.
# ChromeOS board: KEFKA / kefka
# Baseboard / platform lineage: Strago / Intel Braswell
# Firmware assumption: MrChromebox UEFI Full ROM before Yocto boot testing.
#
# Initial POC baseline inherits Poky's generic x86-64 UEFI machine and layers
# Chromebook-specific Braswell policy on top. Board-specific kernel, firmware,
# audio, and input quirks are tracked in docs/KEFKA_HARDWARE_NOTES.md.

require conf/machine/genericx86-64.conf
require conf/machine/include/intel-braswell-chromebook.inc

MACHINEOVERRIDES =. "genericx86-64:kefka-chromebook:intel-braswell-chromebook:"
MACHINE_DISPLAY_NAME = "KEFKA Dell Chromebook 11 3180 Braswell Chromebook"
MACHINE_DESCRIPTION = "Dell Chromebook 11 3180 KEFKA Braswell Chromebook"
