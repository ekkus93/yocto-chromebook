# SNAPPY / Apollo Lake Chromebook target.
#
# Initial POC baseline inherits Poky's generic x86-64 UEFI machine and layers
# Chromebook-specific policy on top. Board-specific kernel, firmware, audio,
# and input quirks are tracked in docs/HARDWARE_NOTES.md.

require conf/machine/genericx86-64.conf
require conf/machine/include/intel-apollolake-chromebook.inc

MACHINEOVERRIDES =. "genericx86-64:snappy-chromebook:intel-apollolake-chromebook:"
MACHINE_DISPLAY_NAME = "SNAPPY Apollo Lake Chromebook"

# The required Chromebook machine ID is `snappy`, which collides with the
# meta-oe compression library recipe PN `snappy` during parse QA because the
# machine name is automatically present in OVERRIDES. The POC image does not
# use that recipe yet, so mask it for this machine until/unless a later
# milestone needs to resolve the conflict differently.
BBMASK += ".*/meta-oe/recipes-extended/snappy/.*"
