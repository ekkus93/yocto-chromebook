# Acer Chromebook Spin 511 R753T / R753TN family.
# Requested representative SKU: R753T-C4XP.
# ChromeOS board: MAGOLOR / magolor
# Baseboard / platform lineage: Dedede / Intel Jasper Lake
# Firmware assumption: MrChromebox UEFI Full ROM or documented alternate UEFI path before Yocto boot testing.
#
# Initial POC baseline inherits Poky's generic x86-64 UEFI machine and layers
# Chromebook-specific Jasper Lake policy on top. Board-specific kernel,
# firmware, audio, and input quirks are tracked in docs/MAGOLOR_HARDWARE_NOTES.md.

require conf/machine/genericx86-64.conf
require conf/machine/include/intel-jasperlake-chromebook.inc

MACHINEOVERRIDES =. "genericx86-64:magolor-chromebook:intel-jasperlake-chromebook:"
MACHINE_DISPLAY_NAME = "MAGOLOR Acer Chromebook Spin 511 R753T Jasper Lake Chromebook"
MACHINE_DESCRIPTION = "Acer Chromebook Spin 511 R753T-C4XP MAGOLOR Jasper Lake Chromebook"
