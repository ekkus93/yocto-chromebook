# Yocto Chromebook distro policy.
#
# This distro is intentionally appliance-style: system packages and base
# applications come from the Yocto image, optional user apps live under /data,
# and production updates are expected to become whole-image A/B updates.

DISTRO = "yocto-chromebook"
DISTRO_NAME = "Yocto Chromebook"
DISTRO_VERSION = "0.1-snapshot"
MAINTAINER = "yocto-chromebook maintainers"

TCLIBC = "glibc"
INIT_MANAGER = "systemd"
require conf/distro/include/init-manager-systemd.inc

DISTRO_FEATURES:append = " systemd wayland opengl pam polkit alsa bluetooth wifi largefile xattr"

# The project is Wayland-first but keeps X11/XWayland compatibility available
# for legacy desktop applications and AppImages.
DISTRO_FEATURES:append = " x11"

# Do not accidentally ship debug/development affordances in production images.
EXTRA_IMAGE_FEATURES:remove = "debug-tweaks"
IMAGE_FEATURES:remove = "debug-tweaks"

# Keep the package feed mechanism an internal build detail. The end-user app
# strategy remains AppImage under /data/apps, not a public package repository.
PACKAGE_CLASSES ?= "package_ipk"
