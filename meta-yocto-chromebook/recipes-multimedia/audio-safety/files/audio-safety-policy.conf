# Yocto Chromebook conservative audio safety policy.
#
# This file is installed as documentation/configuration for early hardware
# bring-up. It is not an assertion that internal speakers are safe.

internal_speakers=unsafe-disabled
initial_mixer_policy=mute-first
safe_initial_outputs=headphones,hdmi,usb-c,usb-audio
require_codec_identity=true
require_amplifier_identity=true
require_topology_identity=true
require_ucm2_identity=true
require_documented_mixer_changes=true
