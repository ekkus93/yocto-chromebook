          path: |
            build/downloads
            build/sstate-cache
          key: yocto-snappy-desktop-${{ runner.os }}-${{ hashFiles('kas/snappy-desktop.yml', 'meta-yocto-chromebook/**/*.bb', 'meta-yocto-chromebook/**/*.bbappend', 'meta-yocto-chromebook/conf/**/*.conf') }}
          restore-keys: |
            yocto-snappy-desktop-${{ runner.os }}-

      - name: Build SNAPPY desktop WIC image
        run: kas shell kas/snappy-desktop.yml -c 'bitbake yocto-chromebook-desktop:do_image_wic'

      - name: Capture SNAPPY desktop image evidence
        run: |
          artifact_dir="build/ci-artifacts/snappy-desktop"
          mkdir -p "$artifact_dir"

          find build -type f \
            \( -name 'yocto-chromebook-desktop-*.wic' \
               -o -name 'yocto-chromebook-desktop-*.wic.gz' \
               -o -name 'yocto-chromebook-desktop-*.manifest' \) \
            -print | sort | tee "$artifact_dir/FOUND_IMAGE_FILES.txt"

          wic="$(find build -type f -name 'yocto-chromebook-desktop-*.wic' | sort | head -n 1 || true)"
          wic_gz="$(find build -type f -name 'yocto-chromebook-desktop-*.wic.gz' | sort | head -n 1 || true)"
          manifest="$(find build -type f -name 'yocto-chromebook-desktop-*.manifest' | sort | head -n 1 || true)"

          for output in "$wic" "$wic_gz" "$manifest"; do
            test -n "$output" && test -e "$output" || {
              echo "Missing expected SNAPPY desktop image output" >&2
