name: Validate

on:
  push:
    branches:
      - master
      - "ralph/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  repo-bootstrap:
    name: Repository and Yocto parse validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Yocto host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y chrpath diffstat

      - name: Allow BitBake user namespaces on Ubuntu 24.04
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Validate repository layout
        run: python3 scripts/validate_repo.py

      - name: Install kas
        run: python3 -m pip install --upgrade kas

      - name: Validate kas configuration expansion
        run: |
          kas dump kas/snappy-poc.yml >/tmp/snappy-poc.yml
          kas dump kas/vorticon-poc.yml >/tmp/vorticon-poc.yml
          kas dump kas/snappy-desktop.yml >/tmp/snappy-desktop.yml
          kas dump kas/vorticon-desktop.yml >/tmp/vorticon-desktop.yml

      - name: Validate BitBake parse for SNAPPY POC
        run: kas shell kas/snappy-poc.yml -c 'bitbake -p'

      - name: Validate SNAPPY POC dependency graph
        run: kas shell kas/snappy-poc.yml -c 'bitbake -g yocto-chromebook-poc'

      - name: Validate BitBake parse for VORTICON POC
        run: kas shell kas/vorticon-poc.yml -c 'bitbake -p'

      - name: Validate VORTICON POC dependency graph
        run: kas shell kas/vorticon-poc.yml -c 'bitbake -g yocto-chromebook-poc'

      - name: Validate BitBake parse for SNAPPY desktop scaffold
        run: kas shell kas/snappy-desktop.yml -c 'bitbake -p'

      - name: Validate SNAPPY desktop dependency graph
        run: kas shell kas/snappy-desktop.yml -c 'bitbake -g yocto-chromebook-desktop'

  snappy-poc-image:
    name: SNAPPY POC image build
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free hosted-runner disk space
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          sudo docker system prune --all --force || true
          df -h

      - name: Install Yocto host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            chrpath \
            cpio \
            diffstat \
            file \
            gawk \
            gcc \
            git \
            lz4 \
            make \
            python3 \
            python3-pip \
            xz-utils \
            zstd

      - name: Allow BitBake user namespaces on Ubuntu 24.04
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install kas
        run: python3 -m pip install --upgrade kas

      - name: Restore Yocto downloads cache
        uses: actions/cache@v4
        with:
          path: |
            build/downloads
            build/sstate-cache
          key: yocto-snappy-poc-${{ runner.os }}-${{ hashFiles('kas/snappy-poc.yml', 'meta-yocto-chromebook/**/*.bb', 'meta-yocto-chromebook/**/*.bbappend', 'meta-yocto-chromebook/conf/**/*.conf') }}
          restore-keys: |
            yocto-snappy-poc-${{ runner.os }}-

      - name: Build SNAPPY POC WIC image
        run: kas shell kas/snappy-poc.yml -c 'bitbake yocto-chromebook-poc:do_image_wic'

      - name: Capture SNAPPY POC image evidence
        run: |
          artifact_dir="build/ci-artifacts/snappy-poc"
          mkdir -p "$artifact_dir"

          echo "Searching for generated SNAPPY POC image outputs under build/"
          find build -type f \
            \( -name 'yocto-chromebook-poc-*.wic' \
               -o -name 'yocto-chromebook-poc-*.wic.gz' \
               -o -name 'yocto-chromebook-poc-*.manifest' \) \
            -print | sort | tee "$artifact_dir/FOUND_IMAGE_FILES.txt"

          wic="$(find build -type f -name 'yocto-chromebook-poc-*.wic' | sort | head -n 1 || true)"
          wic_gz="$(find build -type f -name 'yocto-chromebook-poc-*.wic.gz' | sort | head -n 1 || true)"
          manifest="$(find build -type f -name 'yocto-chromebook-poc-*.manifest' | sort | head -n 1 || true)"

          for output in "$wic" "$wic_gz" "$manifest"; do
            test -n "$output" && test -e "$output" || {
              echo "Missing expected SNAPPY POC image output" >&2
              echo "wic=$wic" >&2
              echo "wic_gz=$wic_gz" >&2
              echo "manifest=$manifest" >&2
              find build -maxdepth 5 -type d | sort >&2
              exit 1
            }
          done

          {
            echo "wic=$wic"
            echo "wic_gz=$wic_gz"
            echo "manifest=$manifest"
          } | tee "$artifact_dir/IMAGE_OUTPUTS.txt"

          sha256sum "$wic" "$wic_gz" "$manifest" | tee "$artifact_dir/SHA256SUMS.txt"
          stat --printf='%n %s bytes\n' "$wic" "$wic_gz" "$manifest" | tee "$artifact_dir/SIZES.txt"

          cp -L "$wic_gz" "$artifact_dir/"
          cp -L "$manifest" "$artifact_dir/"

      - name: Upload SNAPPY POC image artifact
        uses: actions/upload-artifact@v4
        with:
          name: snappy-poc-image-${{ github.sha }}
          path: build/ci-artifacts/snappy-poc/
          if-no-files-found: error
          compression-level: 0

  vorticon-poc-image:
    name: VORTICON POC image build
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free hosted-runner disk space
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          sudo docker system prune --all --force || true
          df -h

      - name: Install Yocto host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            chrpath \
            cpio \
            diffstat \
            file \
            gawk \
            gcc \
            git \
            lz4 \
            make \
            python3 \
            python3-pip \
            xz-utils \
            zstd

      - name: Allow BitBake user namespaces on Ubuntu 24.04
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install kas
        run: python3 -m pip install --upgrade kas

      - name: Restore Yocto downloads cache
        uses: actions/cache@v4
        with:
          path: |
            build/downloads
            build/sstate-cache
          key: yocto-vorticon-poc-${{ runner.os }}-${{ hashFiles('kas/vorticon-poc.yml', 'meta-yocto-chromebook/**/*.bb', 'meta-yocto-chromebook/**/*.bbappend', 'meta-yocto-chromebook/conf/**/*.conf') }}
          restore-keys: |
            yocto-vorticon-poc-${{ runner.os }}-

      - name: Build VORTICON POC WIC image
        run: kas shell kas/vorticon-poc.yml -c 'bitbake yocto-chromebook-poc:do_image_wic'

      - name: Capture VORTICON POC image evidence
        run: |
          artifact_dir="build/ci-artifacts/vorticon-poc"
          mkdir -p "$artifact_dir"

          echo "Searching for generated VORTICON POC image outputs under build/"
          find build -type f \
            \( -name 'yocto-chromebook-poc-*.wic' \
               -o -name 'yocto-chromebook-poc-*.wic.gz' \
               -o -name 'yocto-chromebook-poc-*.manifest' \) \
            -print | sort | tee "$artifact_dir/FOUND_IMAGE_FILES.txt"

          wic="$(find build -type f -name 'yocto-chromebook-poc-*.wic' | sort | head -n 1 || true)"
          wic_gz="$(find build -type f -name 'yocto-chromebook-poc-*.wic.gz' | sort | head -n 1 || true)"
          manifest="$(find build -type f -name 'yocto-chromebook-poc-*.manifest' | sort | head -n 1 || true)"

          for output in "$wic" "$wic_gz" "$manifest"; do
            test -n "$output" && test -e "$output" || {
              echo "Missing expected VORTICON POC image output" >&2
              echo "wic=$wic" >&2
              echo "wic_gz=$wic_gz" >&2
              echo "manifest=$manifest" >&2
              find build -maxdepth 5 -type d | sort >&2
              exit 1
            }
          done

          {
            echo "wic=$wic"
            echo "wic_gz=$wic_gz"
            echo "manifest=$manifest"
          } | tee "$artifact_dir/IMAGE_OUTPUTS.txt"

          sha256sum "$wic" "$wic_gz" "$manifest" | tee "$artifact_dir/SHA256SUMS.txt"
          stat --printf='%n %s bytes\n' "$wic" "$wic_gz" "$manifest" | tee "$artifact_dir/SIZES.txt"

          cp -L "$wic_gz" "$artifact_dir/"
          cp -L "$manifest" "$artifact_dir/"

      - name: Upload VORTICON POC image artifact
        uses: actions/upload-artifact@v4
        with:
          name: vorticon-poc-image-${{ github.sha }}
          path: build/ci-artifacts/vorticon-poc/
          if-no-files-found: error
          compression-level: 0

  snappy-desktop-image:
    name: SNAPPY desktop image build
    # Full desktop WIC qualification currently exceeds the six-hour GitHub-hosted
    # runner ceiling for PRs. Keep it available as an explicit manual gate before
    # claiming the M12 desktop-image build acceptance criterion.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free hosted-runner disk space
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          sudo docker system prune --all --force || true
          df -h

      - name: Install Yocto host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            chrpath \
            cpio \
            diffstat \
            file \
            gawk \
            gcc \
            git \
            lz4 \
            make \
            python3 \
            python3-pip \
            xz-utils \
            zstd

      - name: Allow BitBake user namespaces on Ubuntu 24.04
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install kas
        run: python3 -m pip install --upgrade kas

      - name: Restore Yocto downloads cache
        uses: actions/cache@v4
