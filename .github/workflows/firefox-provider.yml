name: Validate Firefox Provider

on:
  push:
    branches:
      - master
      - "ralph/**"
    paths:
      - ".github/workflows/firefox-provider.yml"
      - "meta-yocto-chromebook/recipes-browser/firefox/**"
      - "meta-yocto-chromebook/recipes-core/packagegroups/packagegroup-yocto-chromebook-desktop.bb"
      - "scripts/validate_repo.py"
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/firefox-provider.yml"
      - "meta-yocto-chromebook/recipes-browser/firefox/**"
      - "meta-yocto-chromebook/recipes-core/packagegroups/packagegroup-yocto-chromebook-desktop.bb"
      - "scripts/validate_repo.py"
  workflow_dispatch:

jobs:
  firefox-provider:
    name: Firefox ESR fetch and package validation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Yocto host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y chrpath diffstat

      - name: Allow BitBake user namespaces on Ubuntu 24.04
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install kas
        run: python3 -m pip install --upgrade kas

      - name: Validate repository layout
        run: python3 scripts/validate_repo.py

      - name: Validate Firefox archive checksum
        run: kas shell kas/snappy-desktop.yml -c 'bitbake firefox-esr-bin -c fetch'

      - name: Validate Firefox install task
        run: kas shell kas/snappy-desktop.yml -c 'bitbake firefox-esr-bin -c install'

      - name: Validate Firefox packaging
        run: kas shell kas/snappy-desktop.yml -c 'bitbake firefox-esr-bin -c package'
